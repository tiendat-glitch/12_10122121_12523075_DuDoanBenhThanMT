map $http_x_request_id $trace_id {
    default $request_id;
    "~^[A-Za-z0-9_-]{1,128}$" $http_x_request_id;
}
log_format structured escape=json '{"timestamp":"$time_iso8601","service":"frontend","request_id":"$trace_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';

server {
    listen ${FRONTEND_PORT};
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout structured;
    client_max_body_size 32k;

    location = /health {
        default_type application/json;
        alias /tmp/frontend-health.json;
        add_header Cache-Control "no-store";
    }
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"api_url":"${API_URL}"}';
    }
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Request-ID $trace_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
